name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Write .env and deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.EC2_HOST }}
          username: ${{ vars.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ${{ vars.EC2_PROJECT_PATH }}

            # Generate .env from GitHub secrets and variables
            cat > .env <<'EOF'
            KC_DB=${{ vars.KC_DB }}
            KC_DB_URL=jdbc:postgresql://postgres:5432/${{ vars.KC_DB_USERNAME }}
            KC_DB_USERNAME=${{ vars.KC_DB_USERNAME }}
            KC_DB_PASSWORD=${{ secrets.KC_DB_PASSWORD }}
            POSTGRES_PASSWORD=${{ secrets.KC_DB_PASSWORD }}
            KC_BOOTSTRAP_ADMIN_USERNAME=${{ vars.KC_BOOTSTRAP_ADMIN_USERNAME }}
            KC_BOOTSTRAP_ADMIN_PASSWORD=${{ secrets.KC_BOOTSTRAP_ADMIN_PASSWORD }}
            KC_HTTP_ENABLED=${{ vars.KC_HTTP_ENABLED }}
            KC_HOSTNAME_STRICT=${{ vars.KC_HOSTNAME_STRICT }}
            KC_PROXY_HEADERS=${{ vars.KC_PROXY_HEADERS }}
            KC_HOSTNAME=${{ vars.KC_HOSTNAME }}
            EOF

            git pull origin main
            docker compose up -d --build
            sudo chmod 644 ./certs/fullchain.pem ./certs/privkey.pem 2>/dev/null || true
            sudo nginx -t && sudo systemctl reload nginx
            echo "✅ Deploy finished successfully!"
